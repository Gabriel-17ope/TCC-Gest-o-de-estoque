<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fornecedor - Sistema de Gerenciamento de Estoque</title>
    <link rel="stylesheet" href="/static/css/estoque_cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <header>
        <p>Fornecedor</p>
        <div class="pesquisa">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" name="pesquisa" placeholder="pesquisa...">
        </div>

        <div id="dados_usuario">
            <img src="../static/imagens/Name.png" alt="Bryan Doe">
            <div id="dados_usuario_nomes">
                <h1>Usuario <br></h1>
                <p>admin</p>
            </div>
        </div>
    </header>
    <div class="pagina">
        <div id="arquitetura">
            <main>
                <form action="{{ url_for('fornecedor.cadastrar_fornecedor') }}" method="post" enctype="multipart/form-data">
                    <div class="input-group">
                        <label for="razaoSocial">Razão Social</label>
                        <input type="text" id="razaoSocial" name="razaoSocial" required>
                    </div>
                    <div class="input-group">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" name="cnpj" required>
                    </div>
                    <div class="input-group">
                        <label for="nome">Nome Fantasia</label>
                        <input type="text" id="nome" name="nomeFantasia" required>
                    </div>
                    <div class="input-group">
                        <label for="contato">Telefone Contato</label>
                        <input type="tel" id="contato" name="contato" required>
                    </div>
                    <div class="input-group">
                        <label for="emailContato">E-mail Contato</label>
                        <input type="email" id="emailContato" name="emailContato" required>
                    </div>
                    <div class="input-group">
                        <label for="imagemFornecedor">Insira Imagem do Fornecedor</label>
                        <input type="file" id="imagemFornecedor" name="imagemFornecedor" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn">Cadastrar Fornecedor</button>
                </form>
            </main>
        </div>
        <div class="barra_lateral">
            <ul>
                <h1> Geral</h1>
                <li><a href="/relatorio">Relatório</a></li>
                <li><a href="/estoque">Estoque</a></li>
                <li><a href="/fornecedor">Fornecedor</a></li>
                <li><a href="/financeiro">Financeiro</a></li>
            </ul>
        </div>
    </div>
    {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
        <ul>
        {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}
</body>
</html>
